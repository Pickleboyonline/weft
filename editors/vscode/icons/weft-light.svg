<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- weft: the thread that passes over and under the warp -->
  <g fill="#6E7488">
    <rect x="2" y="1" width="2.5" height="14" rx="1.25"/>
    <rect x="6.75" y="1" width="2.5" height="14" rx="1.25"/>
    <rect x="11.5" y="1" width="2.5" height="14" rx="1.25"/>
  </g>
  <g fill="#D4861A">
    <rect x="1" y="2" width="14" height="2.5" rx="1.25"/>
    <rect x="1" y="6.75" width="14" height="2.5" rx="1.25"/>
    <rect x="1" y="11.5" width="14" height="2.5" rx="1.25"/>
  </g>
  <g fill="#6E7488">
    <rect x="6.75" y="2" width="2.5" height="2.5"/>
    <rect x="2" y="6.75" width="2.5" height="2.5"/>
    <rect x="11.5" y="6.75" width="2.5" height="2.5"/>
    <rect x="6.75" y="11.5" width="2.5" height="2.5"/>
  </g>
</svg>
